<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Estudio de luz · Society</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/pase.css">
  <script type="importmap">{"imports":{"three":"/vendor/three/three.module.min.js","three/addons/":"/vendor/three/addons/"}}</script>
  <script type="module" src="/js/pase/index.js"></script>
</head>
<body>
  <a class="skip" href="#ficha">Ir a la ficha</a>
  <header class="cabecera">
    <a class="marca" href="/" aria-label="Society, inicio"><i class="marca-sello" aria-hidden="true">◐</i>SOCIETY</a>
    <nav aria-label="Espacio de trabajo" class="nav-global">
      <button id="ir-mesa" type="button" aria-current="page">Estudio de luz</button>
      <button id="ir-encargos" type="button">Encargos</button>
      <a href="/index.html">Estudio general <span aria-hidden="true">↗</span></a>
    </nav>
    <div class="acciones-cabecera"><span id="modo" class="modo" hidden></span><button id="nuevo" class="nuevo" type="button"><span aria-hidden="true">+</span> Nuevo encargo</button></div>
  </header>
  <main>
    <section class="escenario" aria-labelledby="titulo">
      <div class="presentacion">
        <p class="rotulo rotulo-hero"><i aria-hidden="true"></i> Producción editorial</p>
        <h1 id="titulo">Estudio <em>de luz.</em></h1>
        <div class="descripcion-hero"><p id="fase-cabecera"></p><p id="local"></p></div>
        <div class="actividad" id="actividad" tabindex="-1" aria-label="Actividad del estudio" hidden>
          <div class="actividad-sello" aria-hidden="true"><i></i></div>
          <div class="actividad-texto" role="status" aria-live="polite" aria-atomic="true">
            <p class="rotulo">En el estudio <span id="actividad-modelo" hidden></span></p>
            <p id="actividad-oficio"></p>
            <p id="actividad-tarea"></p>
          </div>
        </div>
        <button class="abrir-ficha" id="abrir-ficha" type="button">Abrir ficha <span aria-hidden="true">↘</span></button>
      </div>
      <div class="espacio">
        <div id="escena" class="escena" data-vista="2d" role="group" aria-label="Instrumento óptico de captación">
          <div id="vista-2d" class="vista-2d" aria-hidden="true"></div>
          <div id="vista-3d" class="vista-3d" aria-hidden="true"></div>
          <div id="fotogramas" class="fotogramas">
            <div hidden><a target="_blank" rel="noopener"><img alt="" hidden></a><i aria-hidden="true"></i><small aria-hidden="true"></small></div>
            <div hidden><a target="_blank" rel="noopener"><img alt="" hidden></a><i aria-hidden="true"></i><small aria-hidden="true"></small></div>
          </div>
        </div>
      </div>
      <button id="cambiar-vista" class="vista" type="button" hidden><i aria-hidden="true"></i><span>Vista 2D</span></button>
      <div id="leyenda" class="leyenda" aria-hidden="true"><span></span><b></b></div>
    </section>
    <nav id="recorrido" class="recorrido" aria-label="Recorrido del encargo"></nav>
    <section class="documento" aria-label="Trabajo del encargo">
      <aside class="expediente">
        <p class="rotulo">Expediente</p><h2 id="encargo-titulo">Nuevo encargo</h2><p id="encargo-local"></p>
        <dl class="metadatos">
          <div><dt>Inventario</dt><dd id="pie-inventario">—</dd></div>
          <div><dt>Intentos</dt><dd id="pie-intentos">—</dd></div>
          <div><dt>Entrega</dt><dd id="pie-entrega">—</dd></div>
        </dl>
        <small id="pie-actividad"></small>
      </aside>
      <div class="inspector">
        <section id="ficha" class="ficha" aria-labelledby="ficha-titulo" tabindex="-1">
          <div class="ficha-borde"><span id="ficha-rotulo" class="rotulo">Ficha de trabajo</span><span id="ficha-avance"></span></div>
          <div id="ficha-cuerpo" class="ficha-cuerpo"><h2 id="ficha-titulo">Abriendo el estudio…</h2></div>
        </section>
        <section id="herramientas" class="herramientas" aria-label="Herramientas de la fase" hidden></section>
      </div>
    </section>
  </main>
  <div id="avisos" class="avisos" aria-live="polite"></div>
  <dialog id="dialogo" class="dialogo" aria-labelledby="dialogo-titulo"></dialog>
</body>
</html>
